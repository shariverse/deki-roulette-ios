name: DekiRoulette
options:
  bundleIdPrefix: com.basekeita
  deploymentTarget:
    iOS: "17.0"
    visionOS: "26.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: XU74X3434S
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  DekiRoulette:
    type: application
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: DekiRoulette
    info:
      path: DekiRoulette/Info.plist
      properties:
        CFBundleDisplayName: デキレーレット
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basekeita.roulette
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 代替アイコン（DekiRoulette/Resources/<名前>.icon。scripts/make-icon.swift の alternateIcons と同じ名前を空白区切りで並べる。
        # リリースしたら名前を変えない）
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Neon AppIcon-Pastel AppIcon-Spinner AppIcon-Target
        # visionOS には代替アイコンの仕組みが無い。名前を渡すと「適用できる visionOS のアイコンが無い」と警告されるので空にする
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=xr*]: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2,7"
        GENERATE_INFOPLIST_FILE: NO

  DekiRouletteTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: DekiRouletteTests
    dependencies:
      - target: DekiRoulette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basekeita.roulette.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DekiRoulette:
    build:
      targets:
        DekiRoulette: all
        DekiRouletteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DekiRouletteTests
