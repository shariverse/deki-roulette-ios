name: Build

on:
  push:
    # ドキュメントだけの変更では、macOS ランナーの枠を使わないよう Build を実行しない
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    branches:
      - '**'
  pull_request:
    # ドキュメントだけの変更では、macOS ランナーの枠を使わないよう Build を実行しない
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 手順は再利用ワークフロー（_build.yml）に置き、チェックの名前を build / build に固定する。
  # 同じリポジトリの PR で飛ばした回は build（skipped）になり、push の回の build / build と名前が分かれる
  build:
    # 同じリポジトリのブランチは push で実行済みなので、PR では Fork からのものだけ実行する
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/_build.yml
