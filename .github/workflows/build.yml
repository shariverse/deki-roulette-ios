name: Build

on:
  push:
    # ドキュメントだけの変更では、macOS ランナーの枠を使わないよう Build を実行しない
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    branches:
      - '**'
  pull_request:
    # ドキュメントだけの変更では、macOS ランナーの枠を使わないよう Build を実行しない
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.ref_name }}
    # 同じリポジトリのブランチは push で実行済みなので、PR では Fork からのものだけ実行する
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # .xcodeproj はコミットしていないので project.yml から生成する
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          # 最新の iOS ランタイムに存在する iPhone シミュレータを UDID で選ぶ
          # （名前だけの指定は OS:latest を暗黙に要求し、古いランタイムにしかないデバイスだと解決できない）
          device=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries | map(select(.key | contains("SimRuntime.iOS"))) | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj|tonumber),(.min|tonumber)]) | reverse | map(.value[] | select(.name | startswith("iPhone"))) | .[0].udid')
          echo "Using simulator: $device"
          xcodebuild test \
            -project DekiRoulette.xcodeproj \
            -scheme DekiRoulette \
            -destination "platform=iOS Simulator,id=$device" \
            CODE_SIGNING_ALLOWED=NO
