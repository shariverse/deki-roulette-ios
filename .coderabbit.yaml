# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit の設定: https://docs.coderabbit.ai/reference/configuration
language: ja-JP

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # デフォルトブランチ (develop) 以外に向けた PR もレビューする。
    base_branches:
      - "release/.*"
      - "main"
  path_filters:
    # 自動生成・バイナリ系はレビュー対象外
    - "!**/*.xcassets/**"
    - "!**/Package.resolved"
    - "!DerivedData/**"

chat:
  auto_reply: true
